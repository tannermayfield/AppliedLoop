name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Node 24, the version package.json "engines" pins for Vercel (tests/unit/deploy-config.test.ts
      # fails if they ever disagree).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # A schema change without its migration would deploy green and fail at runtime: generating
      # migrations from the schema must produce nothing new.
      - name: Schema and migrations are in sync
        run: |
          pnpm exec drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::The schema changed without a migration. Run: pnpm db:generate --name <name> and commit drizzle/"
            git status --short drizzle
            exit 1
          fi
      - run: pnpm test
      - run: pnpm build
      # Known vulnerabilities in production dependencies. Informational: it never fails the build
      # (a finding with no patch yet is common); read it when you update dependencies.
      - name: Dependency audit (non-blocking)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    env:
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright drives the Chrome that GitHub's Ubuntu runners already have installed. It starts
      # its own server on :3100 (E2E_PORT) with a throwaway database (E2E_DATA_DIR).
      - run: pnpm e2e
      - name: Keep the Playwright report when the golden path fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
